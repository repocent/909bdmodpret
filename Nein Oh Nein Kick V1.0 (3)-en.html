 const t=ctx.currentTime,ac=1+v.ACC*.6,f0=itp(F0,v.PITCH),pt=itp(PT,v.PITCH)/1000,td=itp(DT,v.DEC)/1000,A0=2*ac;const pre=ctx.createGain();pre.gain.value=.5;const clip=ctx.createWaveShaper();clip.curve=CL909;pre.connect(clip);clip.connect(shaper);const o=ctx.createOscillator(),g=ctx.createGain();o.setPeriodicWave(W909);o.frequency.setValueAtTime(50+f0-50,t);o.frequency.setTargetAtTime(50,t,pt);g.gain.setValueAtTime(A0,t);g.gain.setTargetAtTime(0,t,.046);g.gain.setValueAtTime(A0*Math.exp(-.06/.046),t+.06);g.gain.setTargetAtTime(0,t+.06,td);o.connect(g);g.connect(pre);o.start(t);o.stop(t+.06+td*7+.05);const ag=ctx.createGain();ag.gain.setValueAtTime(v.ATK*ac*.15,t);ag.gain.setTargetAtTime(0,t+.001,.004);ag.connect(shaper);const sr=ctx.sampleRate,pb=ctx.createBuffer(1,sr*.01|0,sr),pdta=pb.getChannelData(0);for(let i=0;i<pdta.length;i++)pdta[i]=i<sr*.002?1:0;const ps=ctx.createBufferSource();ps.buffer=pb;const pl=ctx.createBiquadFilter();pl.type="lowpass";pl.frequency.value=900;ps.connect(pl);pl.connect(ag);ps.start(t);const n=ctx.createBufferSource(),lp=ctx.createBiquadFilter(),ng=ctx.createGain();n.buffer=nbuf;lp.type="lowpass";lp.frequency.value=5000;lp.Q.value=3;ng.gain.value=v.NOISE*.6;n.connect(lp);lp.connect(ng);ng.connect(ag);n.start(t);n.stop(t+.05);const b=document.getElementById("trig");b.classList.add("f");setTimeout(()=>b.classList.remove("f"),80)}
